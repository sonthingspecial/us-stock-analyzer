<title>나는 왜 수학이 어려울까?</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #EEECEA;
    --surface: #F8F7F4;
    --card: #FFFFFF;
    --text: #1C1A18;
    --muted: #7C776F;
    --blue: #3C6899;
    --blue-mid: #5A85B8;
    --blue-light: #E8EFF8;
    --coral: #C96F50;
    --coral-light: #FAF0EB;
    --border: #D8D3CB;
    --radius: 16px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 460px;
    animation: fadeUp 0.4s ease both;
  }
  .screen.active { display: flex; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── START SCREEN ─────────────────────────────────── */
  .start-eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--blue);
    font-weight: 600;
    margin-bottom: 20px;
    padding: 5px 12px;
    background: var(--blue-light);
    border-radius: 100px;
  }

  .start-title {
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 800;
    line-height: 1.2;
    text-align: center;
    text-wrap: balance;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 16px;
  }

  .start-title em {
    font-style: normal;
    color: var(--blue);
  }

  .start-sub {
    font-size: 15px;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
    text-wrap: balance;
    margin-bottom: 40px;
    max-width: 320px;
  }

  .start-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    margin-bottom: 40px;
  }

  .type-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .type-chip .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--blue);
    flex-shrink: 0;
  }
  .type-chip:nth-child(2) .dot { background: var(--coral); }
  .type-chip:nth-child(3) .dot { background: #6BAA8E; }
  .type-chip:nth-child(4) .dot { background: #9B7CC8; }

  .btn-primary {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    padding: 16px 48px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.01em;
    font-family: inherit;
  }
  .btn-primary:hover  { background: #2f5580; }
  .btn-primary:active { transform: scale(0.97); }

  /* ── QUESTION SCREEN ──────────────────────────────── */
  .q-progress {
    width: 100%;
    display: flex;
    gap: 6px;
    margin-bottom: 32px;
  }
  .q-progress-bar {
    flex: 1; height: 3px;
    background: var(--border);
    border-radius: 2px;
    transition: background 0.3s;
  }
  .q-progress-bar.done { background: var(--blue); }

  .q-number {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 12px;
    align-self: flex-start;
  }

  .q-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 28px 24px 24px;
    width: 100%;
    margin-bottom: 20px;
  }

  .q-text {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.55;
    letter-spacing: -0.01em;
    text-wrap: balance;
    color: var(--text);
  }

  .q-hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }

  .scale-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    padding: 0 2px;
    font-weight: 500;
  }

  .scale-buttons {
    display: flex;
    gap: 8px;
    width: 100%;
  }

  .scale-btn {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--surface);
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scale-btn:hover {
    border-color: var(--blue-mid);
    color: var(--blue);
    background: var(--blue-light);
  }
  .scale-btn.selected {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
    transform: scale(1.08);
  }

  /* ── RESULT SCREEN ────────────────────────────────── */
  .result-badge {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 20px;
  }

  .result-type-name {
    font-size: clamp(34px, 9vw, 50px);
    font-weight: 900;
    letter-spacing: -0.03em;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .result-type-sub {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 32px;
    letter-spacing: 0.02em;
  }

  .result-traits {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 20px 16px;
    width: 100%;
    margin-bottom: 16px;
  }

  .result-traits-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 12px;
  }

  .trait-item {
    font-size: 13.5px;
    color: var(--text);
    padding: 6px 0;
    border-bottom: 1px solid var(--bg);
    line-height: 1.5;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .trait-item:last-child { border-bottom: none; }
  .trait-item::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--blue);
    flex-shrink: 0;
    margin-top: 7px;
  }

  .result-message-box {
    background: var(--blue-light);
    border-radius: var(--radius);
    padding: 24px 20px;
    width: 100%;
    margin-bottom: 16px;
    border-left: 3px solid var(--blue);
  }

  .result-message {
    font-size: 15px;
    line-height: 1.85;
    color: var(--text);
    font-weight: 500;
  }

  .anxiety-box {
    background: var(--coral-light);
    border-radius: var(--radius);
    padding: 20px;
    width: 100%;
    margin-bottom: 16px;
    border-left: 3px solid var(--coral);
  }
  .anxiety-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--coral);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .anxiety-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.7;
  }

  .btn-retry {
    background: transparent;
    color: var(--muted);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 32px;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 8px;
    font-family: inherit;
  }
  .btn-retry:hover { border-color: var(--blue); color: var(--blue); }

  /* dual type */
  .dual-type { display: flex; flex-direction: column; align-items: center; gap: 0; }
  .dual-type .result-type-name { font-size: clamp(24px, 6vw, 34px); }

  @media (max-width: 360px) {
    .start-cards { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; }
    .scale-btn { transition: none; }
  }
</style>

<!-- START SCREEN -->
<div class="screen active" id="screen-start">
  <div class="start-eyebrow">수학 학습 심리 자가진단</div>
  <h1 class="start-title">나는 왜<br><em>수학이 어려울까?</em></h1>
  <p class="start-sub">실력 문제가 아닐 수 있어요.<br>5가지 질문으로 내 심리 패턴을 알아봐요.</p>

  <div class="start-cards">
    <div class="type-chip"><span class="dot"></span>타인시선형</div>
    <div class="type-chip"><span class="dot"></span>충동조절형</div>
    <div class="type-chip"><span class="dot"></span>긴장인출형</div>
    <div class="type-chip"><span class="dot"></span>진입차단형</div>
  </div>

  <button class="btn-primary" onclick="startQuiz()">시작하기</button>
</div>

<!-- QUESTION SCREEN -->
<div class="screen" id="screen-question">
  <div class="q-progress" id="progress-bars"></div>
  <div class="q-number" id="q-number"></div>
  <div class="q-card">
    <div class="q-text" id="q-text"></div>
    <div class="q-hint" id="q-hint"></div>
  </div>
  <div class="scale-label">
    <span>전혀 아니다</span>
    <span>매우 그렇다</span>
  </div>
  <div class="scale-buttons" id="scale-buttons"></div>
</div>

<!-- RESULT SCREEN -->
<div class="screen" id="screen-result">
  <div class="result-badge" id="result-badge"></div>
  <div id="result-type-display"></div>
  <div class="result-type-sub" id="result-sub"></div>
  <div class="result-traits" id="result-traits"></div>
  <div class="result-message-box">
    <div class="result-message" id="result-message"></div>
  </div>
  <div class="anxiety-box" id="anxiety-box" style="display:none">
    <div class="anxiety-label">수학 불안 감지</div>
    <div class="anxiety-text" id="anxiety-text"></div>
  </div>
  <button class="btn-retry" onclick="resetQuiz()">다시 하기</button>
</div>

<script>
const questions = [
  {
    text: "수학 문제를 풀 때 주변 시선이나 평가가 신경 쓰인다",
    hint: "예: 친구나 선생님이 보고 있으면 갑자기 긴장된다",
    type: "타인시선형"
  },
  {
    text: "문제를 풀 때 조건을 끝까지 읽지 않고 풀기 시작한 적이 있다",
    hint: "예: 아는 문제 같아서 바로 풀었다가 조건을 놓친 경우",
    type: "충동조절형"
  },
  {
    text: "시험 중에는 안 풀리던 문제가 시험이 끝나고 나서 갑자기 떠오른 적이 있다",
    hint: "예: 시험장 나오는 순간 '아!' 하고 풀이가 생각났다",
    type: "긴장인출형"
  },
  {
    text: "문제를 읽어도 어떤 개념을 적용해야 할지 떠오르지 않는다",
    hint: "예: 무엇을 어떻게 시작해야 할지 막막하게 느껴진다",
    type: "진입차단형"
  },
  {
    text: "수학은 다른 과목보다 유독 걱정되거나 두려움이 느껴진다",
    hint: "수학 시험이나 수업 전부터 불안한 마음이 든다면",
    type: "수학불안"
  }
];

const types = {
  "타인시선형": {
    sub: "혼자선 잘 푸는데, 누가 보면 굳어버리는 유형",
    traits: [
      "누가 보고 있으면 갑자기 손이 멈춘다",
      "혼자서는 잘 풀리는데 시험장에서 실력 발휘가 안 된다",
      "타인의 평가에 예민하게 반응한다"
    ],
    message: "타인의 시선이 내 실력을 결정하는 게 아니에요.\n누가 보든 안 보든 내 실력은 내 거예요.\n틀릴까봐 움츠러드는 마음, 충분히 이해해요.\n하지만 기억하세요. 당신의 실력은 그대로 거기 있어요.",
    color: "#3C6899"
  },
  "충동조절형": {
    sub: "아는 문제를 더 많이 틀리는, 조급한 유형",
    traits: [
      "아는 문제 나오면 흥분해서 서두른다",
      "조건 놓치기, 부호 실수, 계산 오류가 반복된다",
      "쉬운 문제를 더 많이 틀리는 역설이 생긴다"
    ],
    message: "아는 문제가 나와서 흥분했죠? 맞출 수 있는 절호의 기회!\n하지만 호랑이가 토끼를 잡을 때도 전력질주하면서 조심스럽게 잡아요.\n바로 앞에 먹이가 있어도 한 번 더 생각하는 호랑이가 되어봅시다.",
    color: "#C96F50"
  },
  "긴장인출형": {
    sub: "알고 있는데 시험장에서 꺼내지 못하는 유형",
    traits: [
      "시험 중엔 안 풀리다가 끝나면 바로 떠오른다",
      "긴장 상태에서 기억 인출 통로가 좁아진다",
      "실력은 있지만 긴장이 발목을 잡는다"
    ],
    message: "시험이 끝났는데 이제서야 풀이가 보이죠? 너무 속상하죠.\n시험 볼 때 긴장하거나 마음이 조급하면 원래 실력이 다 나오기 어려워요.\n다음엔 이렇게 해봐요. \"못 풀어도 어때?\"\n한 발 뒤로 물러서는 순간, 숨겨진 실력이 나올 수 있어요.",
    color: "#6BAA8E"
  },
  "진입차단형": {
    sub: "개념은 아는데 문제와 연결이 안 되는 유형",
    traits: [
      "문제를 보면 어디서 시작해야 할지 모른다",
      "개념은 아는데 문제와 연결이 안 된다",
      "또는 긴장으로 아예 얼어버리는 경우도 있다"
    ],
    message: "아무 생각이 안 나죠? 괜찮아요.\n아는 게 없어서가 아니라 연결이 안 되는 경우가 많아요.\n문제에서 단어 하나씩 짚어보고, 뭘 구하라고 하는지 다시 읽어봐요.\n생각하는 훈련, 지금 이 순간부터 시작하면 돼요.",
    color: "#9B7CC8"
  }
};

let scores = [0, 0, 0, 0, 0];
let current = 0;

function startQuiz() {
  scores = [0, 0, 0, 0, 0];
  current = 0;
  showQuestion(0);
  switchScreen('screen-question');
}

function showQuestion(idx) {
  const q = questions[idx];
  document.getElementById('q-number').textContent = `질문 ${idx + 1} / ${questions.length}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('q-hint').textContent = q.hint;

  const bars = document.getElementById('progress-bars');
  bars.innerHTML = questions.map((_, i) =>
    `<div class="q-progress-bar ${i < idx ? 'done' : ''}"></div>`
  ).join('');

  const btns = document.getElementById('scale-buttons');
  btns.innerHTML = [1,2,3,4,5].map(n =>
    `<button class="scale-btn" onclick="selectScore(${n})">${n}</button>`
  ).join('');
}

function selectScore(val) {
  scores[current] = val;
  document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.scale-btn')[val-1].classList.add('selected');

  setTimeout(() => {
    current++;
    if (current < questions.length) {
      showQuestion(current);
    } else {
      showResult();
    }
  }, 320);
}

function showResult() {
  const typeScores = { "타인시선형": scores[0], "충동조절형": scores[1], "긴장인출형": scores[2], "진입차단형": scores[3] };
  const maxScore = Math.max(...Object.values(typeScores));
  const winners = Object.keys(typeScores).filter(k => typeScores[k] === maxScore);
  const anxietyScore = scores[4];

  const typeDisplay = document.getElementById('result-type-display');
  const badge = document.getElementById('result-badge');
  const sub = document.getElementById('result-sub');
  const traitsDiv = document.getElementById('result-traits');
  const msgDiv = document.getElementById('result-message');
  const anxietyBox = document.getElementById('anxiety-box');

  if (winners.length === 1) {
    const t = types[winners[0]];
    badge.textContent = '나의 수학 심리 유형';
    badge.style.background = t.color + '18';
    badge.style.color = t.color;
    typeDisplay.innerHTML = `<div class="result-type-name" style="color:${t.color}">${winners[0]}</div>`;
    sub.textContent = t.sub;
    traitsDiv.innerHTML = `<div class="result-traits-label">이런 특징이 있어요</div>` +
      t.traits.map(tr => `<div class="trait-item">${tr}</div>`).join('');
    document.querySelector('.result-message-box').style.borderColor = t.color;
    msgDiv.textContent = t.message;
  } else {
    const first = types[winners[0]];
    badge.textContent = '복합 유형';
    badge.style.background = '#F0EEE9';
    badge.style.color = '#7C776F';
    typeDisplay.innerHTML = `<div class="dual-type">${winners.map(w =>
      `<div class="result-type-name" style="color:${types[w].color}">${w}</div>`
    ).join('<div style="font-size:14px;color:var(--muted);margin:2px 0">+</div>')}</div>`;
    sub.textContent = winners.join(' · ') + ' 복합 패턴이에요';
    traitsDiv.innerHTML = `<div class="result-traits-label">두 가지 패턴이 함께 나타나요</div>` +
      winners.flatMap(w => types[w].traits).map(tr => `<div class="trait-item">${tr}</div>`).join('');
    msgDiv.textContent = winners.map(w => types[w].message).join('\n\n');
  }

  if (anxietyScore >= 4) {
    anxietyBox.style.display = 'block';
    document.getElementById('anxiety-text').textContent =
      '수학에 대한 불안이 꽤 높은 편이에요. 이건 실력의 문제가 아니라 감정의 문제예요. 잘못된 게 없어요. 불안을 느끼는 자신을 탓하지 말고, 작은 성공 경험부터 차근차근 쌓아가 봐요.';
  } else {
    anxietyBox.style.display = 'none';
  }

  switchScreen('screen-result');
}

function resetQuiz() {
  switchScreen('screen-start');
}

function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active');
    s.style.animation = 'none';
  });
  const target = document.getElementById(id);
  target.classList.add('active');
  requestAnimationFrame(() => {
    target.style.animation = '';
  });
}
</script>
